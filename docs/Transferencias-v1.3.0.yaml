components:
  schemas:
    RespuestaDetalleTransferenciaDTO:
      type: object
      required:
        - general_data
        - transfers
      properties:
        general_data:
          description: Datos generales de la consulta
          $ref: '#/components/schemas/DatosGeneralesDTO'
        transfers:
          description: Listado de transferencias
          type: array
          items:
            $ref: '#/components/schemas/DetalleTransferenciaDTO'
    DatosGeneralesDTO:
      type: object
      required:
        - date_since
        - date_until
        - control_code
        - limit
        - total_rows
        - page
        - debit_bank_number
        - debit_currency
        - debit_account_number
        - debit_account_type
        - credit_bank_number
        - credit_currency
        - credit_account_number
        - credit_account_type
      properties:
        date_since:
          description: Fecha inicial de la consulta. Formato AAAA-MM-DD
          $ref: '#/components/schemas/LocalDate'
        date_until:
          description: Fecha final de la consulta. Formato AAAA-MM-DD
          $ref: '#/components/schemas/LocalDate'
        control_code:
          description: Código interno de la consulta
          type: string
        limit:
          format: int32
          description: Cantidad de registros devuelto por página
          type: integer
        total_rows:
          format: int64
          description: Cantidad de total de registros de la consulta
          type: integer
        page:
          format: int32
          description: Número de página de la consulta
          type: integer
        debit_bank_number:
          description: Código de Banco según el BCRA de la cuenta débito
          type: string
          format: ^[0-9]{3}$
        debit_currency:
          description: Moneda de la cuenta débito
          type: string
          enum:
            - ARS
            - USD
        debit_account_number:
          description: Número de la cuenta débito
          type: string
        debit_account_type:
          description: Tipo de la cuenta débito
          type: string
          enum:
            - CA
            - CC
        credit_bank_number:
          description: Código de Banco según el BCRA de la cuenta crédito
          type: string
          format: ^[0-9]{3}$
        credit_currency:
          description: Moneda de la cuenta crédito
          type: string
          enum:
            - ARS
            - USD
        credit_account_number:
          description: Número de la cuenta crédito
          type: string
        credit_account_type:
          description: Tipo de la cuenta crédito
          type: string
          enum:
            - CA
            - CC
    DetalleTransferenciaDTO:
      type: object
      required:
        - transfer_id
        - transaction_number
        - request_date
        - transfer_type_code
        - transfer_type_description
        - debit_account
        - credit_account
        - account_label
        - amount
        - currency
        - refence_number
        - lot_number
        - comments
      properties:
        addenda:
          description: Addenda relacionada
          $ref: '#/components/schemas/AddendaDTO'
        transfer_id:
          format: int32
          description: Número de orden de transferencia
          type: integer
        transaction_number:
          format: int32
          description: Nro. de transacción
          type: integer
        request_date:
          description: Fecha de solicitud (AAAAMMDD)
          $ref: '#/components/schemas/LocalDateTime'
        transfer_type_code:
          description: Identificador de Tipo de Transferencia
          type: string
        transfer_type_description:
          description: Descripcion de Tipo de Transferencia
          type: string
        debit_account:
          description: Detalle de la cuenta débito
          type: object
          $ref: '#/components/schemas/CuentaTransferenciaDTO'
        credit_account:
          description: Detalle de la cuenta crédito
          type: object
          $ref: '#/components/schemas/CuentaTransferenciaDTO'
        account_label:
          description: Nombre del beneficiario
          type: string
        amount:
          description: Importe de la transferencia
          type: number
        currency:
          description: Moneda de la transferencia
          type: string
        reference_number:
          description: Número de referencia
          type: string
        lot_number:
          format: int32
          description: Número de lote
          type: integer
        payment_number:
          description: Número de pago
          type: string
        status:
          description: Estado de la transferencia
          type: string
        client:
          description: Cliente generador de la transferencia
          type: string
        comments:
          description: Observaciones de la transferencia
          type: string
        statement_consolidated:
          description: Movimiento consolidado en extracto
          type: string
        unified_send:
          description: Envío unificado de la transferencia
          type: string
        direct_import:
          description: Observaciones de la transferencia
          type: string
        same_owner:
          description: Observaciones de la transferencia
          type: string
        internal_client_id:
          description: Nro cliente interno
          type: string
    RespuestaComprobanteTransferenciaDTO:
      type: object
      required:
        - general_data
        - transfers
      properties:
        general_data:
          $ref: '#/components/schemas/DatosGeneralesDTO'
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/ComprobanteTransferenciaDTO'
    AddendaDTO:
      type: object
    ComprobanteTransferenciaDTO:
      type: object
      required:
        - request_date
        - transfer_type_description
        - transfer_type_code
        - network_number
        - amount
        - currency
        - debit_account
        - validation_code
      properties:
        request_date:
          description: Fecha de solicitud
          $ref: '#/components/schemas/LocalDateTime'
        transfer_type_description:
          description: Tipo de Transferencia
          type: string
        transfer_type_code:
          description: Identificador de Tipo de Transferencia
          type: string
        transfer_id:
          format: int32
          description: Número de orden de transferencia
          type: integer
        network_number:
          format: int32
          description: Nro. de Red
          type: integer
        amount:
          description: Importe de la transferencia
          type: number
        currency:
          description: Moneda de la transferencia
          type: string
          enum:
            - ARS
            - USD
        debit_account:
          description: Cuenta débito
          type: string
        credit_account:
          description: Cuenta crédito
          type: string
        validation_code:
          description: Codigo de validación
          type: string
        afip:
          description: Detalle comprobante afip
          $ref: '#/components/schemas/AfipDTO'
    CuentaTransferenciaDTO:
      type: object
      required:
        - bank_name
      properties:
        bank_name:
          description: Denominacion del banco
          type: string
        customer_cuit:
          description: CUIT de la empresa
          type: string
          pattern: ^[0-9]{11}$
        bank_number:
          description: Codigo de banco según BCRA
          type: string
          format: ^[0-9]{3}$
        account_type:
          description: Tipo de cuenta
          type: string
          enum:
            - CA
            - CC
        account_number:
          description: Número de la cuenta
          type: string
        currency:
          description: Moneda de la cuenta
          type: string
          enum:
            - ARS
            - USD
        account_cbu:
          description: CBU de la cuenta
          type: string
        account_label:
          description: Nombre de la empresa
          type: string
    CuentaComprobanteDTO:
      type: object
      properties:
        bank_name:
          description: Denominacion del banco
          type: string
        bank_number:
          description: Codigo de banco según BCRA
          type: string
          format: ^[0-9]{3}$
        account_label:
          description: Nombre de la empresa
          type: string
        account_cbu:
          description: CBU de la cuenta
          type: string
        customer_cuit:
          description: CUIT de la empresa
          type: string
          pattern: ^[0-9]{11}$
        taxpayer_cuit:
          description: CUIT de la empresa pagadora
          type: string
          pattern: ^[0-9]{11}$
    AfipDTO:
      type: object
      properties:
        provider_code:
          description: Codigo de proveedor
          type: string
        provider_name:
          description: Nombre del proveedor
          type: string
        vep_number:
          description: Número de Volante Eletrónico de Pago
          type: string
        control_code:
          description: Codigo de control
          type: string
        concept_code:
          description: Codigo de concepto
          type: string
        concept_description:
          description: Descripcion del concepto
          type: string
        fee_number:
          description: Número de cuota
          type: string
        fiscal_period:
          description: Período fiscal
          type: string
        tax_code:
          description: Codigo del impuesto
          type: string
        tax_description:
          description: Descripción del impuesto
          type: string
    ETipoCuenta:
      enum:
        - CC
        - CA
      type: string
    ETipoMoneda:
      enum:
        - USD
        - ARS
      type: string
    LocalDate:
      format: date
      type: string
      example: '2022-03-10T00:00:00.000Z'
    LocalDateTime:
      format: date-time
      type: string
      example: '2022-03-10T12:15:50.000Z'
