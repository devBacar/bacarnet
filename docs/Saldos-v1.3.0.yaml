openapi: 3.0.0
info:
  title: Saldos
  description: |-
    Obtener saldos de las cuentas bancarias. Podrá visualizar los saldos diarios históricos hasta 180 días (consultando en rangos de 64 días) en cualquiera de las cuentas con las que opera en el sistema. Invocando el saldo cuenta a cuenta para cada uno de los bancos que tenga operativos desde la plataforma de Interbanking.

    **Alcance**

    La consulta aplica a todas las cuentas bancarias con las que operás en el sistema de Interbanking.
  contact:
    name: Interbanking
    url: https://interbanking.com.ar/
    email: consultasapi@interbanking.com.ar
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.htmlmp.openapi.extensions.smallrye.openapi=3.0.0
  version: v1.3.0
  x-ibm-name: saldos
servers:
  - url: https://api-gw.interbanking.com.ar/api/prod/v1
tags:
  - name: Saldos
paths:
  /accounts/balances:
    get:
      tags:
        - Saldos
      summary: Obtener el saldo de mis cuentas
      description: Podrá visualizar los saldos diarios históricos hasta 180 días (consultando en rangos de 64 días) en cualquiera de las cuentas con las que opera en el sistema. Invocando el saldo cuenta a cuenta para cada uno de los bancos que tenga operativos desde la plataforma de Interbanking.
      parameters:
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            default: application/json
        - name: account-number
          in: query
          description: Número/s de cuenta/s bancaria/s sobre la cual se requiere obtener saldo/s.
          schema:
            type: array
            items:
              type: string
        - name: account-type
          in: query
          description: |-
            Tipo de cuenta.
            * CA -> Caja de Ahorro
            * CC -> Cuenta Corriente
          schema:
            type: string
            enum:
              - CC
              - CA
        - name: bank-number
          in: query
          description: Número de banco de 3 dígitos asignados por el Banco Central de la Republica Argentina (BCRA)
          schema:
            type: array
            items:
              type: string
              pattern: ^[0-9]{3}$
        - name: currency
          in: query
          description: |-
            Moneda de la cuenta.
            * ARS -> Pesos
            * USD -> Dolares
          schema:
            type: string
            enum:
              - ARS
              - USD
        - name: customer-id
          in: query
          description: |-
            Código de abonado asignado por Interbanking.
            Se obtiene desde Administración-> ABM | Configuración Datos -> Datos de Empresa.
          required: true
          schema:
            type: string
            pattern: ^[A-Z][0-9]{5}[A-Z]$
            example: E32862M
        - name: date-since
          in: query
          description: |-
            Fecha inicial para la búsqueda de saldos históricos.
            Se podrá consultar hasta 180 días en perídos de 60 días por consulta. Formato ISO 8601: yyyy-mm-dd.
          schema:
            type: string
            format: date
            example: '2026-10-04'
        - name: date-until
          in: query
          description: |-
            Fecha final para la búsqueda de saldos históricos.
            Se podrá consultar hasta 180 días en perídos de 60 días por consulta. Formato ISO 8601: yyyy-mm-dd.
          schema:
            type: string
            format: date
            example: '2026-09-05'
        - name: limit
          in: query
          description: 'Cantidad de registros de saldos históricos a retornar. Default: 64'
          schema:
            type: string
            default: 64
            example: '64'
        - name: page
          in: query
          description: 'Página sobre la cual retornar los "n" registros. Default: 0'
          schema:
            type: string
            default: 0
            example: '0'
      responses:
        '200':
          description: Lista de saldos encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSaldosDTO'
              example:
                general_data:
                  bank_number: string
                  date_since: '2022-03-10'
                  date_until: '2022-03-10'
                  currency: USD
                  account_number: string
                  control_code: string
                  limit: 0
                  account_type: CC
                  total_rows: 0
                  page: 0
                accounts:
                  - bank_number: string
                    currency: string
                    account_number: string
                    account_type: string
                    account_label: string
                    account_name: string
                    origin: string
                    row_date: '2022-03-10T12:15:50'
                    message: string
                    balances:
                      countable_balance: 0
                      initial_operating_balance: 0
                      current_operating_balance: 0
                      projected_balance_24hs: 0
                      projected_balance_48hs: 0
                    historical_balances:
                      - operation_date: '2022-03-10T12:15:50'
                        day_balance: 0
                        total_debits: 0
                        total_credits: 0
        '400':
          description: |-
            Request inválido
            1041: No se admiten caracteres especiales
            1044: El campo account-type no es válido
            1040: La fecha no es una fecha válida
            0002: El campo currency no es válida
            1006: El campo page/limit debe ser de tipo numérico
            0101: El campo customer-id debe ser informado
            1038: El campo page debe ser mayor o igual a cero
            1022: El campo limit debe ser mayor a cero
            1048: La fecha inicial no puede ser mayor que la fecha final
            1042: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
        '404':
          description: '1042: No se encontraron saldos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
        '500':
          description: '0000: Error interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
components:
  schemas:
    CuentaSaldoDTO:
      type: object
      properties:
        bank_number:
          description: Código de Banco según el BCRA
          type: string
        currency:
          description: Moneda de la transferencia
          type: string
        account_number:
          description: Nro. de cuenta
          type: string
        account_type:
          description: |-
            Tipo de cuenta.
            * CA -> Caja de Ahorro
            * CC -> Cuenta Corriente
          type: string
          enum:
            - CA
            - CC
        account_label:
          description: Denominacion de la cuenta
          type: string
        account_name:
          description: Nombre de la cuenta
          type: string
        row_date:
          description: Formato AAAA-MM-DDTHH:MM:SS
          $ref: '#/components/schemas/LocalDateTime'
        message:
          description: Mensaje de error de la cuenta
          type: string
        balances:
          $ref: '#/components/schemas/SaldosDTO'
        historical_balances:
          type: array
          items:
            $ref: '#/components/schemas/SaldosHistoricosDTO'
    DatosGeneralesSaldoDTO:
      type: object
      properties:
        bank_number:
          description: Código de Banco según el BCRA
          type: string
        date_since:
          description: Formato AAAA-MM-DD
          $ref: '#/components/schemas/LocalDate'
        date_until:
          description: Formato AAAA-MM-DD
          $ref: '#/components/schemas/LocalDate'
        currency:
          description: Valores posible "$" ó "USD"
          $ref: '#/components/schemas/ETipoMoneda'
        account_number:
          description: Número de cuenta en SIB
          type: string
        control_code:
          description: Código interno de la consulta
          type: string
        limit:
          format: int32
          description: Cantidad de registros devuelto por página
          type: integer
        account_type:
          description: |-
            Tipo de cuenta.
            * CA -> Caja de Ahorro
            * CC -> Cuenta Corriente
          $ref: '#/components/schemas/ETipoCuenta'
        total_rows:
          format: int64
          description: Cantidad de total de registros de la consulta
          type: integer
        page:
          format: int32
          description: Número de página de la consulta
          type: integer
    ETipoCuenta:
      enum:
        - CC
        - CA
      type: string
    ETipoMoneda:
      enum:
        - USD
        - ARS
      type: string
    LocalDate:
      format: date
      type: string
      example: '2022-03-10T00:00:00.000Z'
    LocalDateTime:
      format: date-time
      type: string
      example: '2022-03-10T12:15:50.000Z'
    MensajeError:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        status:
          format: int32
          type: integer
        timestamp:
          $ref: '#/components/schemas/LocalDateTime'
    RespuestaSaldosDTO:
      type: object
      properties:
        general_data:
          $ref: '#/components/schemas/DatosGeneralesSaldoDTO'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/CuentaSaldoDTO'
    SaldosDTO:
      type: object
      properties:
        countable_balance:
          description: 'Máximo 2 decimales. Ej: 100000.50'
          type: number
        initial_operating_balance:
          description: 'Máximo 2 decimales. Ej: 100000.50'
          type: number
        current_operating_balance:
          description: 'Máximo 2 decimales. Ej: 100000.50'
          type: number
        projected_balance_24hs:
          description: 'Máximo 2 decimales. Ej: 100000.50'
          type: number
        projected_balance_48hs:
          description: 'Máximo 2 decimales. Ej: 100000.50'
          type: number
    SaldosHistoricosDTO:
      type: object
      properties:
        operation_date:
          description: Formato AAAA-MM-DDTHH:MM:SS
          $ref: '#/components/schemas/LocalDateTime'
        day_balance:
          description: 'Máximo 2 decimales. Ej: 100000.50'
          type: number
        total_debits:
          description: 'Máximo 2 decimales. Ej: 100000.50'
          type: number
        total_credits:
          description: 'Máximo 2 decimales. Ej: 100000.50'
          type: number
  securitySchemes:
    ClientID:
      type: apiKey
      name: client_id
      x-key-type: client_id
      in: header
    Authorization:
      type: oauth2
      x-ibm-oauth-provider: cas
      flows:
        clientCredentials:
          tokenUrl: https://auth.interbanking.com.ar/cas/oidc/accessToken
          scopes:
            info-financiera: Informacion Financiera
x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  oauth-servers:
    Authorization:
      clientCredentials:
        tokenUrls:
          - https://auth.interbanking.com.ar/cas/oidc/accessToken
        authorizationUrls: []
        refreshUrls: []
security:
  - ClientID: []
    Authorization:
      - info-financiera
x-ibm-endpoints:
  - url: https://api-gw.interbanking.com.ar/api/prod/v1
