openapi: 3.0.0
info:
  title: Confección de Transferencias
  description: |

    La **confección de transferencias** es el primer paso dentro del circuito de generación de una operación.</br>
    A través de las API es posible confeccionar los siguientes tipos de</br> transferencias: </br>

        1. Cuentas propias: movimientos de fondos entre cuentas de la empresa. 
        2. Sueldos: pago de haberes a empleados.  
        3. Proveedores: pago a proveedores.  
        4. Pagos a terceros.  
        5. Pagos ARCA: pago de VEPs de ARCA.

    </br>**Requisitos previos** para confeccionar una transferencia mediante API:

      • Contar con un operador API habilitado en Interbanking.

      • El operador tenga permiso de confección para el tipo de transferencia
        seleccionado.

      • Utilizar cuentas habilitadas para operar.

    Cada request enviado genera un **lote de transferencias**, que agrupa las transferencias solicitadas.</br>

      • Lotes de hasta 10 transferencias: se procesan de forma sincrónica. El
        response incluye las transferencias generadas.

      • Lotes de más de 10 transferencias: se procesan de forma asincrónica. El
        response no incluye las transferencias generadas, sino que devuelve un
        <em>process_id</em> para consultar el resultado del procesamiento.

    </br> <em>Ejemplo de una respuesta asincrónica:</em>
    ```
    {
        "data": {
            "status": true,
            "operation_id": "APITEF-b899-453e-8ea1-255de791-11824e951357",
            "process_id": 52695874,
            "accepted_transfers": null,
            "validated_transfers": null,
            "rejected_transfers": null
        },
        "success": true,
        "timestamp": "2025-12-06T14:53:20.117171701"
    } 
    ```  
    </br>

      </br>Una vez confeccionada, la operación debe continuar su proceso de 
      **autorización y envío** desde las plataformas de Interbanking (web o
      mobile). 

    **Reglas de normalización**

      Al confeccionar un lote de transferencias, el sistema aplica reglas de normalización sobre ciertos campos del request para garantizar la consistencia de la operación.
        
      • Si <em>consolidated_check</em> = true, el campo unified_send será establecido automáticamente en true, independientemente del valor enviado en el request.
        Esta normalización asegura que los lotes con extracto consolidado se procesen siempre como envío unificado.
        
      La normalización se aplica de forma transparente. No genera errores ni rechazos. El request se procesará normalmente y el lote se confeccionará con los valores normalizados.
      Esta regla aplica a todos los endpoints de confección (v1 y v2).

    </br> **Casos de normalizacion:**  
     <table border>
      <tr align="center">
        <th bgcolor="lightgreen">#</th>
        <th bgcolor="lightgreen">consolidated_check (request)</th>
        <th bgcolor="lightgreen">unified_send (request)</th>
        <th bgcolor="lightgreen">unified_send (valor final)</th>
        <th bgcolor="lightgreen">¿Se normalizó?</th>
        <th bgcolor="lightgreen">Descripción</th>
      </tr>
      <tr align="center">
        <td>1</td>
        <td>true</td>
        <td>true</td>
        <td>true</td>
        <td>No</td>
        <td>Coincide con la regla; no requiere cambio</td>
      </tr>
      <tr align="center">
        <td>2</td>
        <td>true</td>
        <td>false</td>
        <td>true</td>
        <td>Si</td>
        <td>El sistema sobreescribe unified_send a true</td>
      </tr>
      <tr align="center">
        <td>3</td>
        <td>false</td>
        <td>true</td>
        <td>true</td>
        <td>No</td>
        <td>Sin regla de normalización; se respeta el valor enviado</td>
      </tr>
      <tr align="center">
        <td>4</td>
        <td>false</td>
        <td>false</td>
        <td>false</td>
        <td>No</td>
        <td>Sin regla de normalización; se respete el valor enviado</td>
      </tr>
    </table> </br> </br>

      **Campos requeridos**

      Para las transferencias del tipo Pago a Terceros es obligatorio informar
      el   concepto de la operación y confirmar la aceptación del disclaimer,
      según corresponda.


    Detalle del disclaimer a aceptar:
    <em>"Estimado Usuario: En virtud del concepto declarado como aplicable a la presente transferencia electrónica de fondos, le informamos que la misma podría encontrarse sujeta a un tratamiento impositivo diferencial. La aplicación de dicho tratamiento por parte de la entidad financiera, en caso de corresponder, podría depender de la acreditación de ciertos requisitos en un plazo determinado. Le sugerimos contactarse directamente con su entidad financiera para obtener más información al respecto."</em>

