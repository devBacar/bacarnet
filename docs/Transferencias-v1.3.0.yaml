openapi: 3.0.0
info:
  title: Transferencias
  description: |-
    Obtener listado con el detalle de las transferencias. Podrá visualizar las transferencias de las cuentas con las que opera en el sistema. Tanto ejecutadas como recibidas (recibidas mediante el sistema Interbanking, aquellas transferencias recibidas desde otros canales como Homebanking no se visualizan). Visualización de transferencias programadas. Obteniendo información en sus estados, fecha, importe, etc.

    <p><strong>Posibles estados de la transferencia:</strong></p>
    <table>
      <thead>
        <tr><th>Estado</th><th>Descripción</th></tr>
      </thead>
      <tbody>
        <tr><td>Confeccionada</td><td>La transferencia fue creada, falta que sea autorizada y enviada.</td></tr>
        <tr><td>En autorización</td><td>Autorizada por alguno de los firmantes, falta la autorización de uno o mas firmantes. Luego debe ser enviada.</td></tr>
        <tr><td>Autorizada</td><td>La transferencia fue Autorizada por los firmantes, falta que sea enviada.</td></tr>
        <tr><td>Enviada banco débito</td><td>Transferencia enviada al banco de débito, el banco debe procesarla.</td></tr>
        <tr><td>Enviada banco crédito</td><td>Las transferencias en este estado deben tomarse como pagadas/finalizadas luego del cierre del día (19hs aprox.). Por ejemplo: si una transferencia con Fecha de solicitud 01/12/26 queda en estado Enviada banco crédito (y no cambia de estado), puede considerarse como pagada (estado final) a partir de las 19hs del día de la Fecha de solicitud.</td></tr>
        <tr><td>Ejecutada</td><td><strong>ESTADO FINAL:</strong> La transferencia finalizó con éxito.</td></tr>
        <tr><td>Recibida por la red</td><td>Transferencia enviada con fecha diferida, se enviará al banco de débito el día de la fecha de solicitud.</td></tr>
        <tr><td>Rechazada banco débito</td><td><strong>ESTADO FINAL:</strong> La transferencia fue rechazada.</td></tr>
        <tr><td>Rechazada banco crédito</td><td><strong>ESTADO FINAL:</strong> La transferencia fue rechazada.</td></tr>
        <tr><td>Rechazada por la red</td><td><strong>ESTADO FINAL:</strong> La transferencia fue rechazada.</td></tr>
        <tr><td>Anulada</td><td><strong>ESTADO FINAL:</strong> La transferencia fue anulada por algún operador de la empresa.</td></tr>
      </tbody>
    </table>
  contact:
    name: Interbanking
    url: https://interbanking.com.ar/
    email: consultasapi@interbanking.com.ar
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.htmlmp.openapi.extensions.smallrye.openapi=3.0.0
  version: v1.3.0
  x-ibm-name: transferencias
servers:
  - url: https://api-gw.interbanking.com.ar/api/prod/v1
tags:
  - name: Transferencias
paths:
  /transfers/details:
    get:
      tags:
        - Transferencias
      summary: Obtener listado con el detalle de las transferencias
      description: Podrá visualizar las transferencias de las cuentas con las que opera en el sistema. Tanto ejecutadas como recibidas (recibidas mediante el sistema Interbanking, aquellas transferencias recibidas desde otros canales como Homebanking no se visualizan).
      parameters:
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            default: application/json
        - name: credit-account-number
          in: query
          description: Número de cuenta bancaria donde se realizó el crédito de la transferencia.
          schema:
            type: string
            example: '5470496471974824'
        - name: credit-account-type
          in: query
          description: |-
            Tipo de cuenta.
            * CA -> Caja de Ahorro
            * CC -> Cuenta Corriente
          schema:
            type: string
            enum:
              - CC
              - CA
        - name: credit-bank-number
          in: query
          description: Número de banco de 3 dígitos asignados por el Banco Central de la Republica Argentina (BCRA).
          schema:
            type: string
            pattern: ^[0-9]{3}$
            example: '852'
        - name: credit-currency
          in: query
          description: |-
            Moneda de la cuenta.
            * ARS -> Pesos
            * USD -> Dolares
          schema:
            type: string
            enum:
              - ARS
              - USD
        - name: customer-id
          in: query
          description: |-
            Código de abonado asignado por Interbanking.
            Se obtiene desde Administración-> ABM | Configuración Datos -> Datos de Empresa.
          required: true
          schema:
            type: string
            pattern: ^[A-Z][0-9]{5}[A-Z]$
            example: I02346W
        - name: date-since
          in: query
          description: |-
            Fecha inicial para la búsqueda de transferencias recibidas y emitidas.
            Se podrá consultar hasta 180 días en periodos de 60 días por consulta. Formato ISO 8601: yyyy-mm-dd.
            Default: fecha del día - 7
          required: true
          schema:
            type: string
            format: date
            example: '2026-02-14'
        - name: date-until
          in: query
          description: |-
            Fecha final para la búsqueda de transferencias recibidas y emitidas.
            Se podrá consultar hasta 180 días en periodos de 60 días por consulta. Formato ISO 8601: yyyy-mm-dd.
            Default: fecha del día - 1
          required: true
          schema:
            type: string
            format: date
            example: '2026-02-20'
        - name: debit-account-number
          in: query
          description: Número de cuenta bancaria donde se realizó el débito de la transferencia.
          schema:
            type: string
            example: '6334410436122142'
        - name: debit-account-type
          in: query
          description: |-
            Tipo de cuenta.
            * CA -> Caja de Ahorro
            * CC -> Cuenta Corriente
          schema:
            type: string
            enum:
              - CC
              - CA
        - name: debit-bank-number
          in: query
          description: Número de banco de 3 dígitos asignados por el Banco Central de la Republica Argentina (BCRA).
          schema:
            type: string
            pattern: ^[0-9]{3}$
            example: '017'
        - name: debit-currency
          in: query
          description: |-
            Moneda de la cuenta.
            * ARS -> Pesos
            * USD -> Dolares
          schema:
            type: string
            enum:
              - ARS
              - USD
        - name: limit
          in: query
          description: 'Cantidad de registros de transferencias a retornar. Default: 100'
          schema:
            type: string
            default: 100
            example: '100'
        - name: page
          in: query
          description: 'Página sobre la cual retornar los "n" registros. Default: 0'
          schema:
            type: string
            default: 0
            example: '0'
      responses:
        '200':
          description: Lista de detalles de transferencia encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDetalleTransferenciaDTO'
              example:
                general_data:
                  bank_number: string
                  row_date: '2022-03-10T12:15:50'
                  date_since: '2022-03-10'
                  date_until: '2022-03-10'
                  currency: USD
                  account_number: string
                  control_code: string
                  limit: 0
                  account_type: CC
                  total_rows: 0
                  page: 0
                  denomination: string
                transfers:
                  - transfer_id: 0
                    transaction_number: 0
                    request_date: '2022-03-10T12:15:50'
                    transfer_type_code: string
                    transfer_type_description: string
                    credit_account:
                      bank_name: string
                    debit_account:
                      bank_name: string
                    account_label: string
                    amount: 0
                    currency: string
                    reference_number: string
                    lot_number: 0
                    payment_number: string
                    status: string
                    client: string
                    comments: string
                    transfer_comments: string
                    statement_consolidated: string
                    unified_send: string
                    direct_import: string
                    same_owner: string
                    internal_client_id: string
                    addenda: {}
        '400':
          description: |-
            Request inválido
            1051: Request param no esperado
            1041: No se admiten caracteres especiales
            0101: Cliente o cuit obligatorio, o datos no actualizados
            1040: La Fecha no es válida
            1044: El campo account-type no es válido
            0002: El campo currency no es válida
            1006: El campo page/limit debe ser de tipo numérico
            1038: El campo page debe ser mayor o igual a cero
            1022: El campo limit debe ser mayor a cero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
              example:
                message: string
                code: string
                status: 0
                timestamp: '2022-03-10T12:15:50'
        '404':
          description: |-
            1048: Fecha final no puede ser anterior a la fecha inicial
            1049: La fecha no puede ser más antigua que un limite de dias
            1042: Cliente no encontrado
            1043: Cuenta no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
        '500':
          description: '0000: Error interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
              example:
                message: string
                code: string
                status: 0
                timestamp: '2022-03-10T12:15:50'
