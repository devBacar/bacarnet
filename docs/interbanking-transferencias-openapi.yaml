        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfeccionCommandDTOTransferenciaAfipCommandDTO'
        required: true
      responses:
        '200':
          description: Procesamiento correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcesoDTO'
        '400':
          description: |-
            1006 - Tipo de dato incorrecto
            1014 - El identificador de transferencia debe ser único
            1005 - Campo obligatorio no informado
            1007 - El campo excede la longitud máxima
            1045 - El campo debe ser alfanumérico
            1047 - El campo no puede contener caracteres especiales
            1000 - Confección sin transferencias
            1004 - La fecha de solicitud es inválida
            1022 - El campo debe ser mayor a cero
            1021 - El campo decimal está mal especificado
            1002 - La cuenta de débito es obligatoria
            1010 - La Fecha de solicitud debe corresponder al día de hoy
            1076 - Campo obligatorio en cuenta debito
            1077 - El campo no posee la longitud definida
            1078 - El operador no tiene acceso o no existe la cuenta débito de la transferencia identificada con el confection_id X
            1079 - El campo vep_number informado () en la transferencia identificada  con el confection_id X no existe o no pertenece a su empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeErrorDto'
        '500':
          description: 1009 - Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeErrorDto'
