      **Especificaciones para APIs versión 1:** 

      En caso de producirse un error en alguna de las transferencias incluidas en
      el lote, todo el lote será rechazado y no se confeccionará ninguna
      transferencia.

      Para cada transferencia enviada es obligatorio especificar los datos de la
      cuenta de débito, crédito e importe. Las cuentas de débito y crédito pueden
      identificarse mediante CBU o mediante el formato de cuenta de Interbanking,
      que incluye el código de banco según BCRA, el tipo de cuenta, el código de
      moneda y el número de cuenta. </br>


    **Especificaciones para APIs versión 2**: </br>
    Pueden producirse dos situaciones en caso de que ocurra un error en las transferencias del lote: 
    Si <em>resend_validated</em> = true, <em>unified_send</em> = false y no  existen errores de horario bancario ni de fecha inválida:

     • Las transferencias correctas se confeccionarán. **Y se informarán en accepted_transfers.**

     • Las rechazadas se informarán en <em>rejected_transfers</em>, junto con sus errores.


    Si <em>resend_validated</em> = false, <em>unified_send</em> = true, o existen errores de horario bancario o de fecha inválida: 
    Las transferencias correctas se agruparán en <em>validated_transfers</em>.  **No se confeccionarán.**
    Las transferencias rechazadas se informarán en <em>rejected_transfers</em>, junto con sus errores.

    Si se detecta un error que no corresponde a una transferencia específica o si existen confection_id duplicados, el lote completo será rechazado.
    Para cada transferencia informada, es obligatorio especificar los datos de la cuenta de débito, crédito e importe. Las cuentas de débito y crédito deben referenciarse mediante CBU. Los datos del formato de cuenta de Interbanking (código de banco según BCRA, tipo de cuenta, código de moneda y número de cuenta) son opcionales.    
