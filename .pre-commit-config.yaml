# Instalación (una vez por clon del repo):
#   pip install pre-commit ggshield
#   pre-commit install
#
# Escaneo manual de todo el repo:
#   ggshield secret scan repo .

repos:
  - repo: https://github.com/GitGuardian/ggshield
    rev: v1.54.0
    hooks:
      - id: ggshield
        language_version: python3
